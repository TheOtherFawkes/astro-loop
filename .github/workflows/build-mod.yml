      - name: Build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleGameDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the real errors as annotations so they can be read without the log
            grep -E "^e: |error:" build.log | head -8 | while IFS= read -r line; do echo "::error::${line}"; done
            grep -A4 "What went wrong" build.log | head -5 | tr '\n' ' ' | sed 's/^/::error::/'; echo
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: astro-loop-mod
          path: app/build/outputs/apk/game/debug/*.apk

